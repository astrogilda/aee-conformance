name: ci

# The conformance suite is two Go modules (the stdlib-only core `aee/` plus the
# go-witness attestor `witnessattestor/`, workspace-linked by go.work) and a
# Python vector-generator + differential harness. CI runs the same gate the
# repo is developed against: build, vet, format, race-test, and lint every Go
# package; type-check and lint the Python; and replay all vectors on the Python
# rail. Nothing here needs the repository to be public.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  go:
    runs-on: ubicloud-standard-2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - name: gofmt (no diffs)
        run: |
          unformatted=$(gofmt -l aee cmd witnessattestor)
          if [ -n "$unformatted" ]; then
            echo "gofmt needs to run on:"; echo "$unformatted"; exit 1
          fi
      - name: build
        run: |
          go build ./aee/... ./cmd/...
          (cd witnessattestor && go build ./...)
      - name: vet
        run: |
          go vet ./aee/... ./cmd/...
          (cd witnessattestor && go vet ./...)
      - name: test (race)
        run: |
          go test ./aee/... ./cmd/... -race -count=1
          (cd witnessattestor && go test ./... -race -count=1)
      # The README advertises cmd/aee-verify as a consumer implementation and
      # separately tells a third party how to wire a rail into the harness.
      # Nothing ran the one against the other, and the shipped CLI scored 0 of
      # 186 the first time anybody tried: its -json mode wrote indented JSON,
      # and the harness parses the last line of stdout. This step runs the real
      # corpus through the real harness against the freshly built binary. It
      # lives in this job rather than the Python one because it needs the Go
      # toolchain, and it refuses rather than skips when that toolchain is
      # absent.
      - name: the shipped CLI clears the published corpus as an external rail
        run: python3 scripts/external-rail-gate.py scripts/forcing-gate.py scripts/forcing-gate-test.py

      - name: coverage (per-file 80% minimum)
        run: |
          go test ./aee/... ./cmd/... -coverprofile=core.cov -count=1
          (cd witnessattestor && go test ./... -coverprofile=../wa.cov -count=1)
          # The aee-witness-demo command is a runnable library-mode example; its
          # attest lifecycle is covered by the attestor tests, so it is excluded.
          python3 scripts/coverage-gate.py --threshold 80 \
            --exclude cmd/aee-witness-demo core.cov wa.cov
      - name: staticcheck
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@latest
          "$(go env GOPATH)/bin/staticcheck" ./aee/... ./cmd/...
          (cd witnessattestor && "$(go env GOPATH)/bin/staticcheck" ./...)
      # The accepted-complexity table in docs/architecture/DESIGN_DECISIONS.md
      # names each branch-heavy Go function and its measured complexity. This
      # gate re-measures and fails on drift. Only the Go rail runs here; the
      # same script gates the Python records in the sibling job, because the two
      # analyzers come from different toolchains. gocyclo is installed from
      # source exactly as staticcheck is above, and this job already runs a
      # python3 gate script (coverage-gate.py).
      - name: accepted-complexity table matches the source
        run: |
          # Pinned, unlike staticcheck@latest above: this tool's numeric output
          # is committed in the table, so an upstream change to how complexity
          # is counted would fail an unrelated PR. Bump deliberately, then run
          # the gate with --sync.
          go install github.com/fzipp/gocyclo/cmd/gocyclo@v0.6.0
          python3 scripts/complexity-table-gate.py --rail go \
            --gocyclo "$(go env GOPATH)/bin/gocyclo"
      - name: golangci-lint (core module)
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.11.4
      - name: golangci-lint (attestor module)
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.11.4
          working-directory: witnessattestor

  python:
    runs-on: ubicloud-standard-2
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: sync toolchain
        run: uv sync --extra dev --extra generators
      - name: mypy --strict
        run: uv run mypy packaging/run_vectors.py vectors/reject/gen_invalid_vectors.py vectors/accept/gen_valid_vectors.py vectors/gen_manifest.py scripts/spec-drift-gate.py scripts/interpretation-registry-gate.py scripts/coverage-matrix-gate.py scripts/complexity-table-gate.py scripts/specpins.py scripts/spec-anchor-gate.py scripts/spec-anchor-gate-test.py scripts/spec-citation-gate.py scripts/code-contract-gate.py scripts/consumer-lag-gate.py scripts/independent-runs-gate.py scripts/condition-registry-gate.py scripts/condition-registry-gate-test.py scripts/condition-forcing-gate.py scripts/condition-forcing-gate-test.py scripts/condition-forcing-crosscheck.py scripts/condition-forcing-crosscheck-test.py scripts/external-rail-gate.py scripts/forcing-gate.py scripts/forcing-gate-test.py scripts/countcensus.py scripts/count-gate.py scripts/count-gate-test.py scripts/regenerability-gate.py scripts/accept-anchor-gate.py scripts/accept-anchor-gate-test.py scripts/liveness-probe.py scripts/liveness-probe-test.py
      # Type-checks by DIRECTORY, which is why it sits beside the pass above
      # rather than replacing it. That one is driven from the list of files
      # written out on the line above, and a list is only accurate on the day it
      # is edited: four files had accumulated that it never named, among them
      # the runner that executes every step in this file. This one derives its
      # scope from [tool.pyright].include and refuses if any Python file in the
      # repository falls outside it, so a new script is covered by existing and
      # not by being remembered. It also refuses if it analysed fewer files than
      # the repository has -- a checker aimed at nothing reports no problems in
      # the same breath and the same exit status as a clean tree.
      #
      # A shell step and not a marketplace action, deliberately: scripts/
      # workflow-steps-gate.py runs every shell step in this directory before a
      # push, so declaring it here is what makes it run locally too. There is no
      # second place to register it and no second place to forget.
      - name: type-check every python file
        run: uv run python scripts/typecheck-gate.py
      - name: ruff
        run: uv run ruff check packaging vectors scripts
      # The other half of the accepted-complexity gate. It runs here rather than
      # beside the Go half because it measures with ruff, and it measures with
      # --ignore-noqa because the marker that brings a function into
      # docs/complexity-rationales.toml is the same marker that stops the step
      # above from reporting its number.
      - name: accepted-complexity rationales match the source
        run: uv run python scripts/complexity-table-gate.py --rail python
      - name: spec/corpus non-drift gate
        run: python3 scripts/spec-drift-gate.py
      # The two citation gates are one check over two spellings. Each holds a
      # ledger pinning every citation to a digest of the prose it addresses, so
      # both fail when a citation comes off its subject rather than only when
      # the number stops resolving. Resolving is what citations of both
      # spellings kept doing while they drifted hundreds of lines from the rules
      # they name.
      - name: spec line-citation gate
        run: python3 scripts/spec-citation-gate.py
      # The anchor gate's own tests, which are mostly refusals for the reason
      # every other gate test here is. This one has now run green while
      # enforcing less than it claimed twice: once when resolution was the only
      # question, and once when a synchronise would refuse a citation that left
      # its subject but waved through one that merely shortened onto part of it.
      # Two of the cases also cover the empty subject set, where the old
      # collector could stop matching, the check could report zero, --sync could
      # write an empty ledger and exit zero, and every run after that was green.
      - name: spec anchor gate
        run: |
          python3 scripts/spec-anchor-gate.py
          python3 scripts/spec-anchor-gate-test.py
      - name: interpretation-decision registry gate
        run: python3 scripts/interpretation-registry-gate.py
      # A condition id is the normative link between a vector and the rule it
      # forces. Both index files pointed a reader at an id-to-spec-line table in
      # the README that has never existed in any revision, and the table that
      # does exist was generated from the ids the reject set happened to use, so
      # 17 ids were cited by live vectors and registered nowhere. This gate
      # reconciles both directions, and its own tests are mostly refusals
      # because a gate evidenced only by a green run is the shape the seven
      # documented pass-while-enforcing-nothing checks had.
      - name: condition-registry gate
        run: |
          python3 scripts/condition-registry-gate.py
          python3 scripts/condition-registry-gate-test.py
      # The failure-code contract the README states, checked against the
      # evaluator that enforces it and against the enumerated code set. It runs
      # the documented third-party response shapes through the runner rather
      # than counting codes, because the drift it exists to catch was prose
      # describing a fallback the evaluator never had.
      - name: failure-code contract gate
        run: python3 scripts/code-contract-gate.py
      # A verifier that rejects its input unconditionally passes every reject
      # vector ever written, and scored against a reject-only corpus it looks
      # perfect. The cure is a paired accept anchor, and the corpus said so in
      # exactly one index row while nothing checked that the property held
      # anywhere else. This gate checks it at both granularities: every reject
      # vector's parent ships as an accept vector, and the traceability gap --
      # the conditions only refusals cite -- is measured and ratcheted rather
      # than left as a caveat in prose. It also reads the two sentences that
      # publish those figures, because the count census skips them on the
      # strength of recording this gate as their owner, and an owner that never
      # opens the prose leaves the one published number in the corpus with
      # nothing behind it. Its own tests are refusals, because a gate that
      # cannot go red is the defect it exists to catch.
      - name: every refusal ships beside a vector that must be accepted
        run: |
          python3 scripts/accept-anchor-gate.py
          python3 scripts/accept-anchor-gate-test.py
      # Detector liveness, computed per channel. A check that never fires and a
      # boundary nothing reached emit the same clean run, so the vectors plant a
      # stimulus per channel and the probe recomputes, from the carried bytes,
      # which channels can show they caught it.
      #
      # The first line is the headline assertion and the second is what makes it
      # worth anything. A probe hard-wired to answer "demonstrated" would clear
      # the first line and report a live detector for a corpus of dead ones, so
      # the test switches off each arm of the construction in turn -- the planted
      # expectation, the commitment comparison, the caught row, the resolved
      # interception, the stronger attribution, the record signature and the
      # run-end seal -- and requires the affected channel to degrade to a named
      # state. It also pins every per-channel verdict the documentation
      # publishes, so prose and computation cannot drift apart.
      - name: per-channel detector liveness, and each arm of it switched off
        run: |
          uv run python scripts/liveness-probe.py --require-demonstrated \
            --key 496cbe15e391eccd3a0864f2709df0eeb4f5b6c1bad750c95cc80ee49bceae62 \
            vectors/accept/ok-052-liveness-probe-per-channel.json
          uv run python scripts/liveness-probe-test.py
      - name: requirement-coverage matrix is current
        run: python3 scripts/coverage-matrix-gate.py --check
      # The suite publishes what it does NOT force, and that figure is the one an
      # outside reader is most entitled to distrust. Two projections of one
      # mutation campaign -- by rail site, and by the normative condition ids the
      # vectors cite -- were taken at two different corpus revisions and then
      # quoted side by side, which reads as two measurements disagreeing when it
      # is one measurement seen twice. The condition projection is now derived
      # from the published baseline on every run rather than recorded by hand, so
      # a corpus that moves without the figure moving fails here. Its own tests
      # are refusals, including the one that stops an unrecognised failure-code
      # identifier being resolved by nearest match, which is how a published weak
      # spot would turn into a claim of coverage.
      #
      # The last two lines are a SECOND implementation of the same three
      # definitions, sharing no code with the generator. --check compares the
      # page against what the generator would write again, which cannot see a
      # generator that read the definitions wrongly: it would write a wrong page
      # and then agree with it. The crosscheck recomputes from the manifest and
      # the baseline and reads the page's prose back, so the two disagree if
      # either is wrong. Its own tests distinguish the two exit codes, because
      # a broken input reported as a disagreement is the same class of defect.
      #
      # --without-history on the two suites, because this job checks out at
      # depth 1 and nineteen of their cases read the git objects the earlier
      # figure is pinned to. Without the flag those cases do not merely fail
      # here: a shallow clone answers exit 2 to every one of them, and four of
      # the nineteen WANT exit 2, so they would have gone green in a clone that
      # could read nothing at all. The flag runs the rest and prints how many it
      # left; the full suites run in forcing-nightly.yml, which fetches
      # everything. A default run in a clone that cannot reach the pinned
      # objects refuses rather than reporting a smaller suite as a passing one.
      - name: the published weak-spot figure follows from the forcing baseline
        run: |
          python3 scripts/condition-forcing-gate.py --check
          python3 scripts/condition-forcing-gate-test.py --without-history
          python3 scripts/condition-forcing-crosscheck.py
          python3 scripts/condition-forcing-crosscheck-test.py --without-history
      # The one column here that is not this author's work is a record of what
      # somebody else ran, so it is worth less than nothing when it is stale.
      # The sentence naming which revisions were NOT run had rotted in three
      # documents at once, each naming a different set and none naming revision
      # 4. This gate derives that set from docs/INDEPENDENT-RUNS.json and fails
      # when the published prose names anything else.
      - name: the independence column is the run ledger
        run: python3 scripts/independent-runs-gate.py
      # The corpus is vendored into rails that live in other repositories, and
      # each of those checks its own copy against its own stamp. Nothing asked
      # whether the copy was current, so the refresh ran when somebody
      # remembered and twice it was not remembered. This gate makes a corpus
      # change here fail until the rails carry it, which is the only place the
      # question can be asked without one repository reading another in CI. It
      # also holds the implementation report to that ledger: the note and the
      # per-rail cells describing what the rails vendor were written at
      # suiteRevision 6 and still said so at 14, and a rail the report named
      # had no row behind it at all.
      - name: consumers carry the corpus this repository publishes, and the report says so
        run: python3 scripts/consumer-lag-gate.py --check
      # A count is a derived fact with exactly one source, and every copy of it
      # in prose is a cache nothing invalidates. The copies went stale at
      # different rates until two documents here disagreed about the size of the
      # same corpus: a badge, a build note and a published crosswalk were each
      # wrong by a different amount, and the crosswalk cited the manifest it
      # disagreed with. This gate checks every published count against its
      # source, and then takes a census: a count-shaped integer that nothing
      # declares fails, so the next one typed into a new paragraph fails on the
      # push that adds it rather than on the revision that outdates it.
      - name: every published count is derived, and no new one is hand-written
        run: |
          python3 scripts/count-gate.py
          python3 scripts/count-gate-test.py
      # Both vector indexes publish a determinism recipe saying the set
      # regenerates byte-identically from the generator beside it, and until
      # this gate nothing ran it. Seven vector files and seven manifest entries
      # were committed with no builder and no index row behind them, and the
      # tree stayed green: the harness replays the committed bytes against the
      # committed manifest, and both had been written by hand. This gate
      # regenerates everything into a copy and diffs, so a file no generator
      # produces fails on the push that adds it.
      - name: every generated file regenerates byte-identically
        run: python3 scripts/regenerability-gate.py
      # The rail's own oracle, which is a different question from the corpus.
      # A vector states what the rail must decide about bytes on disk; the
      # self-test states what the rail must decide about a statement it builds
      # itself, and it reaches two layers no vector can: the hand-rolled RFC
      # 8032 signer, checked against a value the cryptography library produced,
      # and the UTF-16 comparator, whose order stops being expressible once the
      # BMP-only profile is enforced.
      #
      # It shipped with the harness and nothing ran it. Held that way it decayed
      # exactly as an uncalled capability decays: four members the rail now
      # requires were missing from the statement it builds, so its base was
      # invalid, five checks were red, and one of the checks still reporting
      # PASS was satisfied by a code the invalid base emitted anyway rather than
      # by the mutation it names. It runs before the corpus replay because a
      # rail that cannot verify its own statement should be reported as a rail
      # fault rather than as a corpus-wide replay failure.
      #
      # The step name carries no check count on purpose. The self-test prints
      # its own total on every run, which is the one derived source; a number
      # typed here would be a copy of it that nothing invalidates.
      - name: the reference rail clears its own oracle
        run: python3 packaging/run_vectors.py --self-test
      - name: replay every vector on the Python rail (must be 231/231)
        run: python3 packaging/run_vectors.py

  # What the corpus FORCES, held as a tighten-only ratchet. A vector count is an
  # upper bound on forcing and never a measurement of it: a vector declaring
  # several expected codes is satisfied by any one of them, so deleting the
  # result-vocabulary emission from the rail turns two vectors' gate-0 column
  # FAIL and the suite still reports 231 of 231, exit 0. The only way to know
  # what this corpus obliges a third party to implement is to switch one rule
  # off at a time and replay, which is what this job does.
  #
  # It is a separate job, on a wider runner, for two reasons. It is the only job
  # here that is CPU-bound rather than latency-bound -- it rebuilds and replays
  # one mutant per rule -- so it wants cores rather than a place in the queue
  # behind the linters; and it must not lengthen the path a contributor waits on
  # for a lint error.
  #
  # SCOPE: this runs the sites the baseline records as KILLED, which is the
  # complete set where a regression is possible (a regression is by definition a
  # site that used to be killed and is not) and also, by construction, the set
  # already known to build, run and terminate. The remaining sites can only
  # improve; an improvement is invisible to a check that would pass either way,
  # and the nightly full sweep is what sees one. The gate prints what it did not
  # run, by class and count, on every run.
  #
  # MEASURED on a 16-worker workstation, in CPU-seconds because that is the number
  # that carries between machines: 417 of 745 sites and ~1670 CPU-seconds here, against
  # ~3370 for the full sweep. Wall time on that box was 88-110s at 8-16 workers.
  forcing:
    runs-on: ubicloud-standard-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - name: the corpus still forces every rule it is recorded as forcing
        run: python3 scripts/forcing-gate.py --scope forced --workers 8
      # The gate's own tests, which are mostly refusals: this repository has
      # shipped a verifier that scored 0 of 186 while its unit test passed, so a
      # gate evidenced only by a green run is a known failure shape here. Two of
      # the cases are live and one of them is rigged to regress, so the path from
      # a weakened corpus to a non-zero exit is exercised rather than argued.
      - name: the forcing gate can fail
        run: python3 scripts/forcing-gate-test.py
