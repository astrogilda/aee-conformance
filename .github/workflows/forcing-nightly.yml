name: forcing (full sweep)

# The other half of the forcing ratchet.
#
# The per-push job in ci.yml runs the sites the baseline records as KILLED. That
# is the complete set where a REGRESSION is possible, and nothing else, which is
# the right trade for the path a contributor waits on. It is deliberately blind
# to three things, and this is where they are looked for:
#
#   1. an IMPROVEMENT. A new vector, or a tightened rail, can move a rule from
#      unforced to forced. The per-push job never rebuilds those sites, so it
#      would pass either way. Here they are all rebuilt, and a forcing gain that
#      is not yet in the baseline fails this run until it is recorded -- a
#      baseline that lags is a baseline whose per-push subset is smaller than the
#      thing it claims to protect.
#   2. a FALSIFIED ANNOTATION. `docs/FORCING-BASELINE.json` records four sites
#      where "unforced" would be the wrong word: three true equivalent mutants no
#      vector can ever kill, and one rule an earlier check reaches first on every
#      input that could get to it. Those are claims about the world, and this
#      sweep is what can prove one wrong: an annotated site that is KILLED fails.
#   3. a branch that became REACHABLE. The sweep rebuilds the coverage profile
#      and re-derives, for every surviving mutant, whether any vector takes its
#      branch at all -- the evidence that separates a real and mintable corpus gap
#      from a mutant no new vector could kill.
#
# It also carries the two non-terminating mutants, which are INCONCLUSIVE rather
# than unforced and are excluded from the per-push subset precisely so they
# cannot hold that job open.
#
# Measured on a 16-worker workstation: 743 sites, ~3370 CPU-seconds, 137-264 seconds
# of wall time depending on load. Two independent full sweeps produced a
# byte-identical baseline.

on:
  schedule:
    # 04:20 UTC daily. Nothing depends on the hour; it is off the top of the hour
    # so it does not queue behind everything else scheduled at :00.
    - cron: '20 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sweep:
    runs-on: ubicloud-standard-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      # No --sync here. This workflow reports; it never rewrites the record it is
      # checking, because a gate that repairs its own baseline is a gate that
      # cannot go red twice. A run that fails here is closed by a person running
      #   python3 scripts/forcing-gate.py --scope all --sync
      # and committing the diff, which is the moment the forcing delta of a
      # change gets read by somebody.
      - name: every enumerated rule, measured against the baseline
        run: python3 scripts/forcing-gate.py --scope all --workers 8
