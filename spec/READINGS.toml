# Admissible readings of the specification, and what the corpus does about them.
#
# WHY THIS FILE EXISTS. An outside implementer has found the same class of gap
# four times: a rule whose text admits two readings, implemented one way by him
# and the other way by us, scoring IDENTICALLY over the whole corpus. A vector
# count cannot see it, a rail mutation cannot express it -- the rail implements
# one reading, so the rival has no site to be mutated at -- and the
# interpretation registry could only ever ask whether a vector EXISTS. This
# ledger names the rival reading, and scripts/reading-differential.py builds the
# rail under each and replays the whole corpus under both.
#
# HOW TO WRITE AN ENTRY. Write both readings from the TEXT, without looking at
# the vectors, exactly as a mutation catalogue is written without looking at the
# check. `witnessSketch` is mandatory and comes first: if you cannot say what
# vector shape would tell the two apart, you have not yet written a reading pair.
# `expect` may only ever be DISCRIMINATED or REPORT-ONLY. MASKED, UNREACHED and
# EQUIVALENT are findings, and a ledger able to ask for one has turned the
# sharpest available result into a target.
#
# `edit.find` must appear EXACTLY ONCE in the named file and must change bytes.
# Zero matches means the variant is the reference under another name; more than
# one means the edit lands on a site nobody read. Use \t for the leading tabs so
# the anchors survive an editor that reflows whitespace.
#
# EDITS BELONG TO THE RIVAL, AND THEY BELONG IN aee/. Two rules, both learned by
# attacking this ledger rather than by reading it. An edit on the variant flagged
# `implemented` makes the differential a comparison between two rails NEITHER of
# which the repository ships: flag the edited side of the pair below and the gate
# returns DISCRIMINATED at exit 0 with a witness saying bad-742 is valid, which is
# the opposite of what ships. And an edit outside `aee/` is not a reading at all --
# cmd/mutrun decides which fields of a report become the observation, so blanking
# one there moves 195 of 250 vectors and reads as a discrimination. Both are now
# refused.
#
# `specDigest` below pins the revision of the authority text every figure here is
# a claim about. Move the specification and update it in the same edit; the gate
# prints the value to write.

[meta]
spec = "spec/predicates/adversarial-execution-evidence.md"
specDigest = "759d2383e5da36fa509dc335e6159a20b87641b25ebbadcf1676c55d75ffd8b0"


# ---------------------------------------------------------------------------
# Layer 0: normative sentences the corpus cites NOWHERE.
#
# Each row is a declaration, not a suppression. It is keyed on a digest of the
# sentence TEXT rather than on its line number, so a sentence that moves under
# an unrelated edit cannot inherit somebody else's excuse, and a row whose
# sentence has BECOME cited fails the gate: a declaration that has stopped being
# true is worse than none.
#
# Classes are the vocabulary vectors/coverage-unforced.json already ships, so a
# row here can be promoted into that file without translation.
# ---------------------------------------------------------------------------

