[[reading]]
id = "parse-depth-boundary"
title = "Does the 128 nesting bound count containers entered, or the depth of the value inside them?"
sentence = "L139-148"
question = """
The bound is stated as a maximum nesting depth of 128. Two implementations \
counting from different ends agree on every input except one: a value nested to \
exactly the cap. Reading A refuses the container that would make the depth \
exceed 128; reading B refuses the container at 128. Nothing in the sentence \
picks between them, and two rails that disagree only there pass every test the \
other writes.\
"""
witnessSketch = """
One vector nested to exactly the cap, whose innermost container is empty so the \
last level carries no scalar of its own: it parses under the container-counting \
reading and is refused under the off-by-one reading.\
"""
expect = "DISCRIMINATED"
registryDecision = 16

[[reading.variant]]
id = "container-count"
implemented = true
summary = "The counter is incremented on entering a container and the cap refuses the container that would exceed 128, so a value nested to exactly 128 parses."

[[reading.variant]]
id = "off-by-one"
summary = "The cap refuses at 128 rather than beyond it, so the deepest admissible value is nested to 127."

[[reading.variant.edit]]
