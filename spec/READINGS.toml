# ---------------------------------------------------------------------------
# Layer 2: the reading pairs.
# ---------------------------------------------------------------------------

[[reading]]
id = "sealed-existential-constraint-set"
title = "Does the sealed existential bullet range over the clean-row conjuncts, or only the structural members?"
sentence = "L586-594"
question = """
The existential bullet requires a statement carrying a `basis: substrate` row to \
carry at least one `sealed` record "that satisfies every constraint of its kind". \
The kind bullet lists the members a `sealed` payload MUST carry. A separate \
sentence states the clean-row conjuncts -- `aeeStillArmed` true, `aeeDropCount` \
within a declared bound, `aeePostureDigest` equal to the pinned posture -- and \
calls a failure of them a coverage VALIDITY failure. Both readings of "every \
constraint" are admissible from the text: the narrow one takes the aeeKind \
bullet's members, the broad one takes those plus the conjuncts.\
"""
witnessSketch = """
One vector: a `basis: substrate` row, at least one sealed record satisfying every \
structural constraint, no sealed record whose clean-row conjuncts hold, and no \
clean intercepted row, since `row-uncovered-sealed` fires first and hides the \
question otherwise.\
"""
witnessCandidates = [
  "v4da2f99ac2897154",
  "v80e2a3fba582ed4d",
  "vd7be865fc69eacc2",
  "v7258b9f4ed52a08d",
  "vfb979cb9ce40f1be",
]
# REPORT-ONLY rather than DISCRIMINATED, and the difference is the finding.
# Restricted to the five candidates above -- the vectors a registry entry would
# have cited -- this pair returns MASKED: every dirty seal among them is paired
# with a clean one, so the broad reading is satisfied by the clean seal, the
# sweep rejects the dirty one, and both readings land in the same place for
# different reasons. bad-1017 was written from the sketch this reading emitted
# and moves the pair to REPORT-ONLY: no verdict moves, one condition code does.
#
# Pinning the expectation is what makes a regression visible. Without it a
# corpus change that returned this pair to MASKED would read as a clean run,
# which is the shape the whole harness exists to refuse.
expect = "REPORT-ONLY"
registryDecision = 21

[[reading.variant]]
id = "broad"
implemented = true
summary = "The existential's candidate must satisfy the aeeKind members AND the clean-row conjuncts, so a statement carrying only moat-down seals has no covering seal."

[[reading.variant]]
id = "narrow"
summary = "The existential's candidate need only satisfy the aeeKind members; the clean-row conjuncts belong to the sweep bullet, not to this one."

